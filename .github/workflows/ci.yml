# Quality: deterministic hygiene checks. Same input, same verdict, every time, so they may BLOCK.
# Make `hygiene` a required status check in branch protection.
# No agent runs here. Review (agent, then human) happens in Claude Code / Cowork, and only comments.

name: ci

# Runs automatically: no one has to start it. Every pull request gets a run when it is opened,
# on every new push to it, and when it is reopened. Pushes to main run it too.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # `!cancelled()` lets every check report even when an earlier one fails,
      # so one red run shows every problem rather than the first.
      - name: Lint and format
        if: ${{ !cancelled() }}
        run: ruff check . && ruff format --check .

      - name: Architecture (api -> service -> repo)
        if: ${{ !cancelled() }}
        run: lint-imports

      - name: Tests, coverage >= 90%
        if: ${{ !cancelled() }}
        run: pytest -q --cov=shop
