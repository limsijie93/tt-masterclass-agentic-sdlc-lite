# Beat 2: deterministic hygiene. Same input, same verdict, every time, so it is allowed to BLOCK.
# Make `hygiene` a required status check in branch protection.
# No agent runs here. Judgement (beats 3 and 4) happens in Claude Code / Cowork, and only comments.

name: ci

# Runs automatically: no one has to start it. Every pull request gets a run when it is opened,
# on every new push to it, and when it is reopened. Pushes to main run it too.
on:
  pull_request:
    types: [opened, synchronize, reopened]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  hygiene:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 2  # the Scope step diffs the PR merge commit against its base parent
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]"

      # `!cancelled()` lets every check report even when an earlier one fails,
      # so one red run shows every problem rather than the first.
      - name: Lint and format
        if: ${{ !cancelled() }}
        run: ruff check . && ruff format --check .

      - name: Architecture (api -> service -> repo)
        if: ${{ !cancelled() }}
        run: lint-imports

      - name: Tests, coverage >= 90%
        if: ${{ !cancelled() }}
        run: pytest -q --cov=shop

      # Scope: every changed file must be listed under **Touches** in the spec this PR adds or edits.
      # Added by /harvest (#2): PR #3 added shop/discounts.py, which the spec never listed.
      # ponytail: only checks PRs whose diff includes specs/<N>.md; follow-ups without a spec are skipped.
      - name: Scope (changed files are under the spec's Touches)
        if: ${{ !cancelled() && github.event_name == 'pull_request' }}
        run: |
          changed=$(git diff --name-only HEAD^1 HEAD)
          spec=$(echo "$changed" | grep -E '^specs/[0-9]+\.md$' | head -1 || true)
          if [ -z "$spec" ]; then echo "No spec in this PR: skipped."; exit 0; fi
          touches=$(grep -m1 '^\*\*Touches:\*\*' "$spec" | grep -o '`[^`]*`' | tr -d '`')
          fail=0
          for f in $changed; do
            [ "$f" = "$spec" ] && continue
            ok=0
            for t in $touches; do
              if [ "$f" = "$t" ] || { [[ $t == */ ]] && [[ $f == "$t"* ]]; }; then ok=1; fi
            done
            if [ "$ok" = 0 ]; then echo "::error file=$f::$f is not listed under Touches in $spec"; fail=1; fi
          done
          exit $fail
