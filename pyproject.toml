[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["pytest==9.1.1"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shop"]

[tool.pytest.ini_options]
pythonpath = ["."]  # import shop without relying on the editable install
