[project]
name = "shop"
version = "0.1.0"
requires-python = ">=3.12"

[project.optional-dependencies]
dev = ["ruff==0.16.10", "pytest==9.1.1", "pytest-cov==7.1.0", "import-linter==2.15"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["shop"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.pytest.ini_options]
pythonpath = ["."]  # import shop without relying on the editable install

[tool.coverage.report]
fail_under = 90
show_missing = true

# The architecture rule: api -> service -> repo, and api never reaches past service.
[tool.importlinter]
root_package = "shop"

[[tool.importlinter.contracts]]
name = "Layers: api -> service -> repo"
type = "layers"
layers = ["shop.api", "shop.service", "shop.repo"]

[[tool.importlinter.contracts]]
# A layers contract alone allows api to skip service and import repo. This one forbids it.
name = "api must not import repo"
type = "forbidden"
source_modules = ["shop.api"]
forbidden_modules = ["shop.repo"]
allow_indirect_imports = true
